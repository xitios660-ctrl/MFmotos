.app{display:grid;grid-template-columns:238px 1fr;min-height:100vh}.side{height:100vh;position:sticky;top:0;border-right:1px solid #222;padding:18px 12px;background:#090909}.nav{display:grid;gap:5px;margin-top:24px}.nav button{border:1px solid transparent;background:none;color:#999;text-align:left;padding:11px;border-radius:11px;cursor:pointer}.nav button.on{color:#fff;background:#280b0d;border-color:#4d181b}.main{min-width:0}.top{height:66px;position:sticky;top:0;z-index:25;display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:#090909e8;backdrop-filter:blur(15px);border-bottom:1px solid #222}.content{padding:22px;max-width:1450px;margin:auto}.hero{display:flex;justify-content:space-between;align-items:end;gap:15px;margin-bottom:18px}.hero h1{font-size:38px;line-height:.95;margin:5px 0;text-transform:uppercase}.eyebrow{font-size:10px;color:var(--red);letter-spacing:2px}.actions{display:flex;gap:8px;flex-wrap:wrap}
.grid{display:grid;gap:12px}.stats{grid-template-columns:repeat(6,1fr)}.card{background:linear-gradient(180deg,#131313,#0d0d0d);border:1px solid #262626;border-radius:16px;padding:15px}.stat b{font-size:28px}.stat small{display:block;color:#777}.two{grid-template-columns:1.2fr .8fr}.title{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.list{display:grid;gap:7px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid #252525;background:#0b0b0b;padding:11px;border-radius:11px}.row small{display:block;color:#777}
.badge{display:inline-block;font-size:10px;border:1px solid #353535;border-radius:999px;padding:4px 7px;color:#aaa;white-space:nowrap}.badge.r{color:#ff7378;border-color:#5e1b1f}.badge.g{color:#6ae8a2;border-color:#1f5439}.badge.y{color:#ffe085;border-color:#554817}.toolbar{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:12px}.toolbar .input{max-width:430px}.tableWrap{overflow:auto;border:1px solid #252525;border-radius:14px}.table{width:100%;min-width:720px;border-collapse:collapse;background:#0c0c0c}.table th,.table td{padding:11px;border-bottom:1px solid #202020;text-align:left}.table th{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#777;background:#111}.money{font-weight:900}.gold{color:var(--gold)}.green{color:var(--green)}.empty{text-align:center;color:#666;padding:28px}.warn{border:1px solid #55491f;background:#1b1709;color:#d7c776;border-radius:12px;padding:11px;margin-bottom:12px}
.modal{position:fixed;inset:0;z-index:90;display:grid;place-items:center;background:#000c;backdrop-filter:blur(7px);padding:15px}.modalCard{width:min(720px,100%);max-height:92vh;overflow:auto;background:#101010;border:1px solid #333;border-radius:18px}.modalHead{padding:14px 16px;border-bottom:1px solid #252525;display:flex;justify-content:space-between;align-items:center}.modalBody{padding:16px}.form{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.span{grid-column:1/-1}.products{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.product{border:1px solid #292929;background:#0c0c0c;padding:12px;border-radius:12px;cursor:pointer}.product:hover{border-color:#852228}.product small{display:block;color:#777}.product .price{color:var(--gold);font-weight:900;margin-top:6px}.posgrid{display:grid;grid-template-columns:1fr .72fr;gap:14px}.cartline{display:grid;grid-template-columns:1fr 65px 32px;gap:7px;align-items:center;padding:9px 0;border-bottom:1px solid #222}.ai{border:1px solid #4b1719;background:#180708;border-radius:15px;padding:13px;margin-bottom:13px}.chat{max-height:260px;overflow:auto;display:grid;gap:7px;margin:9px 0}.bubble{white-space:pre-wrap;background:#191919;border-radius:11px;padding:9px}.bubble.me{background:#2a0d0e;margin-left:10%}.toast{position:fixed;right:18px;bottom:18px;z-index:120;background:#151515;border:1px solid #333;border-radius:11px;padding:11px 14px}.mobile{display:none}

/* ===== MF CINEMATIC MOTORCYCLE UI ===== */
:root{
  --red:#ff1820;--red2:#8d050a;--redGlow:rgba(255,24,32,.22);
  --bg:#050505;--panel:#0d0d0e;--panel2:#121214;--line:#26262a;
  --text:#f7f7f8;--muted:#8c8c93;--gold:#ffd166;--green:#36db8b;
  --glass:rgba(14,14,16,.78)
}
html{background:#050505;scroll-behavior:smooth}
body{
  background:
    radial-gradient(circle at 82% -8%,rgba(255,24,32,.18),transparent 30%),
    radial-gradient(circle at 12% 88%,rgba(255,24,32,.07),transparent 26%),
    linear-gradient(180deg,#070708 0%,#030303 100%);
  overflow-x:hidden;
}
body:before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;opacity:.24;
  background-image:
    linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);
  background-size:44px 44px;
  mask-image:linear-gradient(to bottom,black,transparent 88%);
}
body:after{
  content:"";position:fixed;width:46vw;height:46vw;right:-20vw;top:20vh;
  border:1px solid rgba(255,24,32,.08);border-radius:50%;pointer-events:none;z-index:-1;
  box-shadow:0 0 0 70px rgba(255,24,32,.025),0 0 0 140px rgba(255,24,32,.018);
}
::selection{background:var(--red);color:#fff}
.btn{
  position:relative;overflow:hidden;border-color:#303036;background:linear-gradient(180deg,#1a1a1d,#111114);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.035),0 9px 24px rgba(0,0,0,.14);
  transition:.22s ease;
}
.btn:before{content:"";position:absolute;inset:-1px;transform:translateX(-120%) skewX(-18deg);background:linear-gradient(90deg,transparent,rgba(255,255,255,.15),transparent);transition:transform .5s ease}
.btn:hover{transform:translateY(-2px);border-color:#555;box-shadow:0 12px 26px rgba(0,0,0,.24)}
.btn:hover:before{transform:translateX(120%) skewX(-18deg)}
.btn.red{background:linear-gradient(135deg,#ff1b23,#a8070c 72%);box-shadow:0 12px 30px rgba(239,16,22,.2),inset 0 1px 0 rgba(255,255,255,.18)}
.btn.red:hover{box-shadow:0 16px 40px rgba(239,16,22,.32)}
.input,select,textarea{
  background:linear-gradient(180deg,#0a0a0c,#070708);border-color:#29292d;
  transition:border-color .2s,box-shadow .2s,transform .2s;
}
.input:focus,select:focus,textarea:focus{border-color:#a91a20;box-shadow:0 0 0 3px rgba(255,24,32,.09),0 12px 24px rgba(0,0,0,.18)}
.login{position:relative;overflow:hidden;background:radial-gradient(circle at 50% 45%,rgba(255,24,32,.09),transparent 34%)}
.login:before,.login:after{content:"";position:absolute;border-radius:50%;pointer-events:none}
.login:before{width:580px;height:580px;border:1px solid rgba(255,24,32,.12);box-shadow:0 0 0 55px rgba(255,24,32,.025),0 0 0 110px rgba(255,24,32,.015);animation:slowSpin 22s linear infinite}
.login:after{width:190px;height:190px;border:1px dashed rgba(255,255,255,.09);animation:slowSpin 10s linear infinite reverse}
.loginCard{
  position:relative;z-index:2;background:linear-gradient(145deg,rgba(22,22,25,.94),rgba(7,7,8,.96));
  border-color:#34343a;border-radius:28px;padding:30px;box-shadow:0 40px 120px #000,0 0 70px rgba(255,24,32,.07);
  backdrop-filter:blur(24px);animation:loginIn .65s cubic-bezier(.2,.8,.2,1);
}
.loginCard:before{content:"MF // RIDE CONTROL";position:absolute;right:22px;top:16px;font-size:8px;letter-spacing:2.6px;color:#5e5e66}
.loginCard:after{content:"";position:absolute;left:28px;right:28px;top:0;height:2px;background:linear-gradient(90deg,transparent,var(--red),transparent);box-shadow:0 0 18px var(--red)}
.login h1{font-size:38px;letter-spacing:-1.6px}
.mf{font-size:34px;text-shadow:0 0 28px rgba(255,24,32,.16)}
.mf:after{box-shadow:0 0 20px rgba(255,24,32,.28)}
.side{
  width:238px;background:linear-gradient(180deg,rgba(12,12,14,.96),rgba(5,5,6,.99));
  border-right-color:#202024;backdrop-filter:blur(18px);overflow:hidden;
}
.side:after{content:"";position:absolute;left:0;right:0;bottom:-120px;height:320px;background:radial-gradient(circle at 20% 100%,rgba(255,24,32,.16),transparent 56%);pointer-events:none}
.nav button{position:relative;transition:.2s ease;border-radius:13px;color:#85858d;letter-spacing:.1px}
.nav button:hover{color:#fff;background:#151518;transform:translateX(3px)}
.nav button.on{background:linear-gradient(90deg,rgba(255,24,32,.18),rgba(255,24,32,.035));border-color:#511216;box-shadow:inset 3px 0 0 var(--red),0 8px 26px rgba(0,0,0,.16)}
.nav button.on:after{content:"";position:absolute;right:9px;top:50%;width:5px;height:5px;border-radius:50%;background:var(--red);box-shadow:0 0 13px var(--red);transform:translateY(-50%)}
.top{
  height:70px;background:rgba(7,7,9,.78);backdrop-filter:blur(22px) saturate(1.2);
  border-bottom-color:#202024;
}
.top:after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,rgba(255,24,32,.26),transparent)}
.systemStatus{display:inline-flex;align-items:center;gap:7px;margin-left:14px;color:#777;font-size:9px;letter-spacing:1.6px;text-transform:uppercase}
.liveDot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 12px rgba(54,219,139,.8);animation:pulseDot 1.8s ease-in-out infinite}
.content{padding:26px;max-width:1510px}
.content.page-enter>*{animation:pageIn .5s cubic-bezier(.2,.75,.2,1) both}
.content.page-enter>*:nth-child(2){animation-delay:.04s}.content.page-enter>*:nth-child(3){animation-delay:.08s}
.hero{
  position:relative;padding:21px 22px;margin-bottom:16px;border:1px solid #242429;border-radius:22px;
  background:linear-gradient(105deg,rgba(18,18,21,.94),rgba(10,10,12,.75));
  overflow:hidden;align-items:center;box-shadow:0 18px 55px rgba(0,0,0,.25);
}
.hero:before{content:"";position:absolute;right:-45px;top:-105px;width:310px;height:310px;border-radius:50%;border:1px solid rgba(255,24,32,.13);box-shadow:0 0 0 34px rgba(255,24,32,.025),0 0 0 69px rgba(255,24,32,.015)}
.hero:after{content:"";position:absolute;left:0;top:0;width:120px;height:2px;background:linear-gradient(90deg,var(--red),transparent);box-shadow:0 0 18px rgba(255,24,32,.7)}
.hero>*,.card>*{position:relative;z-index:1}
.hero h1{font-size:42px;letter-spacing:-2px;margin:7px 0 3px}
.eyebrow{display:flex;align-items:center;gap:8px;font-weight:900}
.eyebrow:before{content:"";width:24px;height:2px;background:var(--red);box-shadow:0 0 12px var(--red)}
.card{
  position:relative;overflow:hidden;background:linear-gradient(145deg,#111114,#0a0a0c);
  border-color:#25252a;border-radius:18px;box-shadow:0 16px 40px rgba(0,0,0,.16);
  transition:transform .23s ease,border-color .23s ease,box-shadow .23s ease;
}
.card:hover{transform:translateY(-3px);border-color:#3d3d44;box-shadow:0 20px 46px rgba(0,0,0,.27)}
.card:before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(130deg,rgba(255,255,255,.025),transparent 42%)}
.stat{min-height:118px;display:flex;flex-direction:column;justify-content:flex-end}
.stat:after{content:"";position:absolute;right:-38px;top:-38px;width:100px;height:100px;border-radius:50%;border:1px solid rgba(255,24,32,.08);box-shadow:0 0 0 15px rgba(255,24,32,.02)}
.stat b{font-size:30px;letter-spacing:-1.4px}.stat small{text-transform:uppercase;letter-spacing:1.15px;font-size:9px}
.cockpit{
  display:grid;grid-template-columns:1.4fr .6fr;gap:14px;margin-bottom:14px;padding:20px;
  border:1px solid #2b2b30;border-radius:22px;background:
    radial-gradient(circle at 87% 50%,rgba(255,24,32,.15),transparent 29%),
    linear-gradient(120deg,#141416,#09090b);
  box-shadow:0 24px 70px rgba(0,0,0,.28);overflow:hidden;position:relative;
}
.cockpit:before{content:"";position:absolute;inset:auto 0 0 0;height:1px;background:linear-gradient(90deg,transparent,var(--red),transparent);opacity:.42}
.cockpitCopy{display:flex;flex-direction:column;justify-content:center;min-height:180px}
.cockpitCopy .kicker{font-size:9px;letter-spacing:2.8px;color:#777;text-transform:uppercase}
.cockpitCopy h2{font-size:34px;line-height:1.02;letter-spacing:-1.5px;margin:8px 0}
.cockpitCopy p{color:#8a8a92;max-width:620px;margin:0}
.cockpitActions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.gaugeWrap{display:grid;place-items:center;min-height:190px}
.gauge{width:166px;height:166px;border-radius:50%;padding:13px;background:conic-gradient(var(--red) 0 68%,#2a2a2f 68% 82%,#151518 82% 100%);box-shadow:0 0 55px rgba(255,24,32,.13);animation:gaugeIn .9s ease both}
.gaugeInner{width:100%;height:100%;border-radius:50%;background:radial-gradient(circle,#17171a 0,#09090b 68%);border:1px solid #33333a;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:inset 0 0 32px #000}
.gaugeInner strong{font-size:38px;line-height:1}.gaugeInner span{font-size:8px;letter-spacing:2px;color:#777;margin-top:6px}
.tableWrap{border-color:#25252a;border-radius:17px;background:#0b0b0d;box-shadow:0 15px 40px rgba(0,0,0,.13)}
.table{background:transparent}.table th{background:#111114;color:#777780;padding:13px 12px}.table td{padding:13px 12px;border-color:#1e1e22}
.table tbody tr{transition:.18s ease}.table tbody tr:hover{background:#141416;box-shadow:inset 3px 0 0 rgba(255,24,32,.6)}
.row{background:linear-gradient(180deg,#0d0d0f,#09090b);border-color:#242429;transition:.2s ease}
.row:hover{border-color:#393940;transform:translateX(2px)}
.badge{text-transform:uppercase;letter-spacing:.7px;font-weight:850;background:#0b0b0c}
.badge.g{background:#07160f}.badge.y{background:#191607}.badge.r{background:#1a0809}
.product{position:relative;overflow:hidden;border-color:#26262b;background:linear-gradient(145deg,#111114,#09090b);min-height:112px;transition:.22s ease}
.product:after{content:"+";position:absolute;right:12px;bottom:9px;font-size:22px;color:#46464d;transition:.22s}
.product:hover{border-color:#74151a;transform:translateY(-3px);box-shadow:0 16px 36px rgba(0,0,0,.2)}
.product:hover:after{color:var(--red);text-shadow:0 0 14px rgba(255,24,32,.65);transform:scale(1.15)}
.product .price{font-size:18px}
.posgrid>.card{position:sticky;top:88px;height:max-content}
.ai{
  position:relative;overflow:hidden;border-color:#561418;background:
    radial-gradient(circle at 95% 10%,rgba(255,24,32,.16),transparent 30%),
    linear-gradient(145deg,#17090b,#0b090a);
  border-radius:20px;padding:16px;box-shadow:0 20px 56px rgba(0,0,0,.22);
}
.ai:before{content:"";position:absolute;left:-30%;right:-30%;height:1px;top:0;background:linear-gradient(90deg,transparent,var(--red),transparent);animation:scanLine 3.2s ease-in-out infinite}
.ai>b{letter-spacing:1.4px}.ai>b:before{content:"●";color:var(--red);margin-right:8px;text-shadow:0 0 12px var(--red);animation:pulseDot 1.6s infinite}
.chat{scrollbar-width:thin;scrollbar-color:#3b1114 transparent}
.bubble{border:1px solid #242429;background:#101012;box-shadow:0 8px 22px rgba(0,0,0,.12);animation:bubbleIn .32s ease both}
.bubble.me{background:linear-gradient(135deg,#2b0c0f,#18090b);border-color:#4d1216}
.warn{border-color:#5b4917;background:linear-gradient(120deg,#1d1708,#100e08);box-shadow:inset 3px 0 0 #d6aa29}
.modal{background:rgba(0,0,0,.78);backdrop-filter:blur(12px)}
.modalCard{background:linear-gradient(150deg,#151518,#09090b);border-color:#35353b;border-radius:22px;box-shadow:0 35px 100px #000,0 0 55px rgba(255,24,32,.06);animation:modalIn .28s cubic-bezier(.2,.8,.2,1)}
.modalHead{background:#0e0e10;border-color:#29292e}
.toast{border-radius:14px;background:rgba(18,18,21,.94);backdrop-filter:blur(14px);box-shadow:0 18px 45px rgba(0,0,0,.32);animation:toastIn .3s ease}
.plateScan{position:relative;overflow:hidden;border-radius:12px}
.plateScan.scanning:after{content:"";position:absolute;left:0;right:0;height:2px;background:var(--red);box-shadow:0 0 18px var(--red);animation:plateScanner 1s ease-in-out infinite}
.scanResult{margin-top:8px;padding:10px 12px;border:1px solid #29292e;border-radius:11px;background:#0a0a0c}
.mobile{background:rgba(12,12,15,.9);border-color:#303036;box-shadow:0 18px 60px rgba(0,0,0,.42);backdrop-filter:blur(22px)}
.mobile button{transition:.2s}.mobile button.on{background:linear-gradient(180deg,#2e0d10,#19090b);box-shadow:inset 0 -2px 0 var(--red);color:#fff}
@keyframes pageIn{from{opacity:0;transform:translateY(10px) scale(.995)}to{opacity:1;transform:none}}
@keyframes loginIn{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
@keyframes modalIn{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:none}}
@keyframes bubbleIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@keyframes toastIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes slowSpin{to{transform:rotate(360deg)}}
@keyframes pulseDot{50%{opacity:.45;transform:scale(.78)}}
@keyframes scanLine{0%,100%{transform:translateY(0);opacity:.25}50%{transform:translateY(330px);opacity:.8}}
@keyframes plateScanner{0%{top:0;opacity:.25}50%{top:calc(100% - 2px);opacity:1}100%{top:0;opacity:.25}}
@keyframes gaugeIn{from{transform:rotate(-25deg) scale(.9);opacity:0}to{transform:none;opacity:1}}
@media(max-width:1050px){.cockpit{grid-template-columns:1fr .45fr}.gauge{width:145px;height:145px}}
@media(max-width:760px){
  body:after{display:none}.top{height:62px}.top .actions .btn:first-child{display:none}.systemStatus{display:none}
  .content{padding:12px 9px 84px}.hero{padding:17px 15px;border-radius:18px}.hero h1{font-size:30px;letter-spacing:-1px}
  .cockpit{grid-template-columns:1fr;padding:16px;border-radius:18px}.cockpitCopy{min-height:auto}.cockpitCopy h2{font-size:28px}.gaugeWrap{min-height:150px}.gauge{width:132px;height:132px}
  .stat{min-height:98px}.stat b{font-size:24px}.card{border-radius:15px}.posgrid>.card{position:static}
  .loginCard{padding:24px 20px}.login h1{font-size:33px}.login:before{width:420px;height:420px}
}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

.startRideWrap{margin-top:20px;display:flex;align-items:center;gap:12px}
.startRideBtn{
  position:relative;isolation:isolate;display:flex;align-items:center;justify-content:space-between;gap:18px;
  width:min(430px,100%);min-height:68px;padding:0 18px 0 22px;border:1px solid rgba(255,74,80,.58);

    radial-gradient(circle at 82% 50%,rgba(255,255,255,.12),transparent 17%),
    linear-gradient(115deg,#ff1b23 0%,#c70b12 48%,#6d0509 100%);

}
.startRideBtn:before{

  background:linear-gradient(105deg,transparent 36%,rgba(255,255,255,.28) 48%,rgba(255,255,255,.07) 54%,transparent 64%);

}
.startRideBtn:hover{transform:translateY(-3px) scale(1.015);box-shadow:0 24px 60px rgba(255,24,32,.36),0 0 28px rgba(255,24,32,.13)}

@keyframes startRideSheen{0%,38%{transform:translateX(-75%) rotate(2deg)}68%,100%{transform:translateX(78%) rotate(2deg)}}

<body>
<section id="login" class="login">
<div class="loginCard">
<div class="brand"><div class="mf">MF</div><div><b>MF MOTO PEÇAS</b><small>CENTRAL DE OPERAÇÕES</small></div></div>
<h1>A LOJA ACELERA.<br><span class="redtxt">VOCÊ CONTROLA.</span></h1>
<p class="muted">Vendas, peças e motos organizadas em uma operação só.</p>

<div id="authError" class="redtxt"></div>
</form>
</div>
</section>

<main class="main"><header class="top"><span>MF / <b id="crumb">VISÃO GERAL</b><span class="systemStatus"><i class="liveDot"></i>Sistema online</span></span><div class="actions"><button class="btn red" onclick="go(\'atendimento\')">+ Atendimento</button><button class="btn" onclick="logout()">Sair</button></div></header><div id="content" class="content"></div></main>

</div>
<div id="modal" class="modal hide"></div><div id="toast" class="toast hide"></div>
<script>
var NAV=[['overview','⌁','Visão geral'],['atendimento','⚙','Atendimento'],['orders','◉','Ordens'],['budgets','◇','Orçamentos'],['inventory','▦','Estoque'],['clients','♙','Clientes'],['fiscal','§','Fiscal'],['security','⌾','Segurança']];
var S={token:localStorage.mf_token||'',page:'overview',clients:[],inventory:[],orders:[],budgets:[],sales:[],fiscal:[],cart:[],chat:[],aiDraft:null,attDraft:null,lastAttendance:null};
function qs(s){return document.querySelector(s)}function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]})}
function brl(n){return Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}function dt(d){return d?new Date(d).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'}):'-'}
function toast(t,err){var x=qs('#toast');x.textContent=t;x.style.borderColor=err?'#6b1e22':'#285b3e';x.classList.remove('hide');setTimeout(function(){x.classList.add('hide')},3000)}
async function api(url,opt){opt=opt||{};var h=Object.assign({'content-type':'application/json'},opt.headers||{});if(S.token)h.authorization='Bearer '+S.token;var r=await fetch('/api'+url,Object.assign({},opt,{headers:h})),d={};try{d=await r.json()}catch(e){}if(!r.ok){if(r.status===401&&S.token)logout();throw Error(d.error||'Erro na operação')}return d}
function showApp(ok){qs('#login').classList.toggle('hide',ok);qs('#app').classList.toggle('hide',!ok)}
function logout(){localStorage.removeItem('mf_token');S.token='';showApp(false);loadRegistrationStatus()}
function togglePass(id,b){var i=qs('#'+id);if(!i)return;i.type=i.type==='password'?'text':'password';if(b)b.textContent=i.type==='password'?'Mostrar':'Ocultar'}
async function loadRegistrationStatus(){try{var d=await api('/auth/registration-status');qs('#tabRegister').classList.toggle('hide',!d.open);if(!d.open&&authMode==='register')authModeSet('login')}catch(e){qs('#tabRegister').classList.add('hide')}}
var authMode='login';function authModeSet(m){authMode=m;qs('#tabLogin').classList.toggle('on',m==='login');qs('#tabRegister').classList.toggle('on',m==='register');qs('#nameField').classList.toggle('hide',m==='login');qs('#authSubmit').textContent=m==='login'?'ENTRAR NA CENTRAL':'CRIAR ACESSO'}
qs('#tabLogin').onclick=function(){authModeSet('login')};qs('#tabRegister').onclick=function(){authModeSet('register')};
qs('#authForm').onsubmit=async function(e){e.preventDefault();try{var body={name:qs('#authName').value,email:qs('#authEmail').value,password:qs('#authPass').value};var d=await api('/auth/'+(authMode==='login'?'login':'register'),{method:'POST',body:JSON.stringify(body)});S.token=d.token;localStorage.mf_token=S.token;await boot()}catch(x){qs('#authError').textContent=x.message}};
function navs(){var a=NAV.map(function(n){return '<button data-page="'+n[0]+'" class="'+(S.page===n[0]?'on':'')+'">'+n[1]+' '+n[2]+'</button>'}).join('');qs('#nav').innerHTML=a;qs('#mobileNav').innerHTML=a;document.querySelectorAll('[data-page]').forEach(function(b){b.onclick=function(){go(b.dataset.page)}})}
async function boot(){showApp(true);navs();await go('overview')}async function go(p){S.page=p;navs();var n=NAV.find(function(x){return x[0]===p});qs('#crumb').textContent=(n?n[2]:p).toUpperCase();var fn={overview:overview,atendimento:pos,pos:pos,inventory:inventory,orders:orders,budgets:budgets,clients:clients,fiscal:fiscal,security:security}[p];if(fn)try{await fn();var box=qs('#content');box.classList.remove('page-enter');void box.offsetWidth;box.classList.add('page-enter')}catch(e){toast(e.message,true)}}
function hero(t,s,a){return '<div class="hero"><div><div class="eyebrow">MF / RIDE CONTROL</div><h1>'+t+'</h1><div class="muted">'+s+'</div></div><div class="actions">'+(a||'')+'</div></div>'}
function badge(s){var c=s==='concluido'||s==='emitida'?'g':s==='pendente'||s==='rascunho'?'y':'r';return '<span class="badge '+c+'">'+esc(String(s||'-').replaceAll('_',' '))+'</span>'}
function modal(title,html){qs('#modal').innerHTML='<div class="modalCard"><div class="modalHead"><b>'+esc(title)+'</b><button class="btn" onclick="closeModal()">×</button></div><div class="modalBody">'+html+'</div></div>';qs('#modal').classList.remove('hide')}function closeModal(){qs('#modal').classList.add('hide');qs('#modal').innerHTML=''}
async function del(url,back){if(!confirm('Excluir este registro?'))return;try{await api(url,{method:'DELETE'});toast('Excluído.');back()}catch(e){toast(e.message,true)}}
async function overview(){var d=await api('/dashboard'),o=await api('/orders');var open=Math.max(0,+d.open_orders||0),gauge=Math.min(92,Math.max(18,28+open*9));var stats=[['VENDAS HOJE',brl(d.today_sales),'↗'],['OS ABERTAS',d.open_orders,'⚙'],['PRODUTOS',d.inventory,'▦'],['CLIENTES',d.clients,'●'],['ORÇAMENTOS',d.budgets,'◇'],['ESTOQUE BAIXO',d.low_stock,'!']];qs('#content').innerHTML=hero('VISÃO GERAL','Cockpit operacional da MF Moto Peças.','<button class="btn red" onclick="go(\'atendimento\')">+ Iniciar atendimento</button>')+'<section class="cockpit"><div class="cockpitCopy"><div class="kicker">MF MOTO PEÇAS // OPERAÇÃO AO VIVO</div><h2>CONTROLE TOTAL.<br><span class="redtxt">RITMO DE PISTA.</span></h2><p>Vendas, oficina, peças e clientes em um único painel. Tudo que precisa de atenção aparece primeiro.</p><div class="startRideWrap"><button class="startRideBtn" onclick="go(\'atendimento\')"><span class="startRideText"><strong>INICIAR ATENDIMENTO</strong><small>Cliente · Moto · IA · Orçamento · OS · Venda</small></span><span class="startRideIcon"><span>›</span></span></button></div></div><div class="gaugeWrap"><div class="gauge" style="background:conic-gradient(var(--red) 0 '+gauge+'%,#2a2a2f '+gauge+'% 82%,#151518 82% 100%)"><div class="gaugeInner"><strong>'+d.open_orders+'</strong><span>OS ABERTAS</span></div></div></div></section><div class="grid stats">'+stats.map(function(x){return '<div class="card stat"><small>'+x[0]+'</small><b>'+x[1]+'</b><span style="position:absolute;right:14px;top:12px;color:#4d4d55;font-size:16px">'+x[2]+'</span></div>'}).join('')+'</div><div class="grid two" style="margin-top:12px"><div class="card"><div class="title"><b>ORDENS RECENTES</b><button class="btn" onclick="go(\'orders\')">Ver todas</button></div><div class="list">'+(o.slice(0,6).map(function(x){return '<div class="row"><div><b>'+esc(x.client_name||x.plate)+'</b><small>'+esc([x.brand,x.model,x.plate].filter(Boolean).join(' · '))+'</small></div>'+badge(x.status)+'</div>'}).join('')||'<div class="empty">Nenhuma moto na oficina ainda.</div>')+'</div></div><div class="card"><div class="title"><b>ATALHOS DE BOX</b><span class="badge r">RIDE CONTROL</span></div><div class="list"><button class="btn" onclick="go(\'inventory\')">Cadastrar peça →</button><button class="btn" onclick="go(\'budgets\')">Criar orçamento →</button><button class="btn" onclick="go(\'pos\')">Nova venda →</button><button class="btn" onclick="openOrder()">Abrir OS →</button></div></div></div>'}
async function clients(){S.clients=await api('/clients');qs('#content').innerHTML=hero('CLIENTES','Cadastro e histórico da oficina.','<button class="btn red" onclick="openClient()">+ Novo cliente</button>')+'<div class="toolbar"><input id="clientSearch" class="input" placeholder="Buscar cliente"></div><div class="tableWrap"><table class="table"><thead><tr><th>Nome</th><th>Telefone</th><th>E-mail</th><th>CPF/CNPJ</th><th></th></tr></thead><tbody id="clientRows"></tbody></table></div>';function paint(v){qs('#clientRows').innerHTML=(v.map(function(c){return '<tr><td><b>'+esc(c.name)+'</b></td><td>'+esc(c.phone)+'</td><td>'+esc(c.email)+'</td><td>'+esc(c.cpf_cnpj)+'</td><td><button class="btn danger" onclick="del(\'/clients/'+c.id+'\',clients)">Excluir</button></td></tr>'}).join('')||'<tr><td colspan="5" class="empty">Nenhum cliente.</td></tr>')}paint(S.clients);qs('#clientSearch').oninput=function(e){var x=e.target.value.toLowerCase();paint(S.clients.filter(function(c){return JSON.stringify(c).toLowerCase().includes(x)}))}}
function openClient(){modal('Novo cliente','<form id="clientForm" class="form"><div class="field"><label>Nome</label><input name="name" class="input" required></div><div class="field"><label>Telefone</label><input name="phone" class="input"></div><div class="field"><label>E-mail</label><input name="email" type="email" class="input"></div><div class="field"><label>CPF/CNPJ</label><input name="cpf_cnpj" class="input"></div><button class="btn red span">Salvar cliente</button></form>');qs('#clientForm').onsubmit=async function(e){e.preventDefault();try{await api('/clients',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});closeModal();toast('Cliente salvo.');clients()}catch(x){toast(x.message,true)}}}
async function inventory(){S.inventory=await api('/inventory');qs('#content').innerHTML=hero('ESTOQUE','Peças, quantidades, preços e compatibilidade.','<button class="btn red" onclick="openItem()">+ Cadastrar peça</button>')+'<div class="toolbar"><input id="invSearch" class="input" placeholder="Buscar peça, SKU ou modelo"></div><div class="tableWrap"><table class="table"><thead><tr><th>Produto</th><th>Compatível</th><th>Qtd.</th><th>Custo</th><th>Venda</th><th></th></tr></thead><tbody id="invRows"></tbody></table></div>';function paint(v){qs('#invRows').innerHTML=(v.map(function(x){return '<tr><td><b>'+esc(x.name)+'</b><br><small>'+esc(x.sku||x.category||'')+'</small></td><td>'+esc((x.moto_models||[]).join(', '))+'</td><td class="'+(x.is_low_stock?'redtxt':'')+'"><b>'+x.quantity+'</b> / mín '+x.min_quantity+'</td><td>'+brl(x.cost)+'</td><td class="gold money">'+brl(x.price)+'</td><td><button class="btn danger" onclick="del(\'/inventory/'+x.id+'\',inventory)">Excluir</button></td></tr>'}).join('')||'<tr><td colspan="6" class="empty">Nenhum item cadastrado.</td></tr>')}paint(S.inventory);qs('#invSearch').oninput=function(e){var x=e.target.value.toLowerCase();paint(S.inventory.filter(function(i){return JSON.stringify(i).toLowerCase().includes(x)}))}}
function openItem(){modal('Cadastrar peça','<form id="itemForm" class="form"><div class="field"><label>Nome</label><input name="name" class="input" required></div><div class="field"><label>SKU/Código</label><input name="sku" class="input"></div><div class="field"><label>Categoria</label><input name="category" class="input"></div><div class="field"><label>Modelos compatíveis</label><input name="moto_models" class="input" placeholder="PCX 150, CG 160"></div><div class="field"><label>Quantidade</label><input name="quantity" type="number" min="0" class="input" value="0"></div><div class="field"><label>Estoque mínimo</label><input name="min_quantity" type="number" min="0" class="input" value="3"></div><div class="field"><label>Custo</label><input name="cost" type="number" step=".01" class="input"></div><div class="field"><label>Preço de venda</label><input name="price" type="number" step=".01" class="input"></div><button class="btn red span">Cadastrar peça</button></form>');qs('#itemForm').onsubmit=async function(e){e.preventDefault();try{await api('/inventory',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});closeModal();toast('Peça cadastrada.');inventory()}catch(x){toast(x.message,true)}}}
async function orders(){S.orders=await api('/orders');qs('#content').innerHTML=hero('ORDENS DE SERVIÇO','Acompanhe as OS criadas pelo Atendimento.','<button class="btn red" onclick="go(\'atendimento\')">+ Novo atendimento</button>')+'<div class="tableWrap"><table class="table"><thead><tr><th>Moto</th><th>Cliente</th><th>Serviço</th><th>Valor</th><th>Status</th><th></th></tr></thead><tbody>'+(S.orders.map(function(o){return '<tr><td><b>'+esc([o.brand,o.model].filter(Boolean).join(' ')||o.plate)+'</b><br><small>'+esc(o.plate)+' · '+esc(o.year||'')+' '+esc(o.color||'')+'</small></td><td>'+esc(o.client_name||'-')+'</td><td>'+esc(o.description)+'</td><td>'+brl(o.final_cost||o.estimated_cost)+'</td><td>'+badge(o.status)+'</td><td><button class="btn" onclick="advance(\''+o.id+'\')">Avançar</button> <button class="btn danger" onclick="del(\'/orders/'+o.id+'\',orders)">Excluir</button></td></tr>'}).join('')||'<tr><td colspan="6" class="empty">Nenhuma OS.</td></tr>')+'</tbody></table></div>'}
async function openOrder(){try{var hubClient=qs('#saleClient')?qs('#saleClient').value:'';S.clients=await api('/clients');modal('Abrir ordem de serviço','<form id="orderForm" class="form"><div class="field"><label>Cliente</label><select name="client_id" id="orderClient"><option value="">Sem cliente</option>'+S.clients.map(function(c){return '<option value="'+c.id+'">'+esc(c.name)+'</option>'}).join('')+'</select></div><div class="field"><label>Placa</label><div class="plateScan" id="plateScan"><div style="display:flex;gap:6px"><input class="input" name="plate" id="plateInput" required placeholder="ABC1D23"><button class="btn" type="button" id="plateLookup">Escanear</button></div></div></div><div class="field"><label>Marca</label><input class="input" name="brand" id="brandInput"></div><div class="field"><label>Modelo</label><input class="input" name="model" id="modelInput"></div><div class="field"><label>Ano</label><input class="input" name="year" id="yearInput"></div><div class="field"><label>Cor</label><input class="input" name="color" id="colorInput"></div><div class="field span"><label>Serviço/queixa</label><textarea name="description" placeholder="Opcional se o atendimento já tiver itens"></textarea></div><div class="field"><label>Estimativa</label><input class="input" name="estimated_cost" type="number" step=".01"></div><div class="field"><label>Status</label><select name="status"><option value="pendente">Pendente</option><option value="em_andamento">Em andamento</option></select></div><div id="plateResult" class="muted span scanResult">Digite a placa e toque em Escanear.</div><button class="btn red span">Criar OS</button></form>');if(hubClient)qs('#orderClient').value=hubClient;if(S.cart.length){qs('[name=estimated_cost]').value=S.cart.reduce(function(a,x){return a+x.price*x.q},0);qs('[name=description]').value=S.cart.map(function(x){return x.name}).join(', ')}qs('#plateLookup').onclick=async function(){var scan=qs('#plateScan'),btn=qs('#plateLookup'),res=qs('#plateResult');scan.classList.add('scanning');btn.textContent='Lendo...';res.textContent='Consultando base veicular...';try{var d=await api('/vehicle/'+qs('#plateInput').value);res.textContent=d.found?'Moto localizada: '+[d.brand,d.model,d.year,d.color].filter(Boolean).join(' · '):d.message;if(d.found){qs('#brandInput').value=d.brand||'';qs('#modelInput').value=d.model||'';qs('#yearInput').value=d.year||'';qs('#colorInput').value=d.color||''}}catch(e){toast(e.message,true);res.textContent='Não foi possível concluir a consulta.'}finally{scan.classList.remove('scanning');btn.textContent='Escanear'}};qs('#orderForm').onsubmit=async function(e){e.preventDefault();var d=Object.fromEntries(new FormData(e.target));var c=S.clients.find(function(x){return x.id===d.client_id});d.client_name=c?c.name:'';if(S.cart.length){d.items=S.cart.map(function(x){return {inventory_id:x.manual?null:(x.inventory_id||x.id),name:x.name,quantity:x.q,unit_price:x.price,total:moneyClient(x.q*x.price),type:x.manual?'servico':'produto'}});if(!d.estimated_cost)d.estimated_cost=S.cart.reduce(function(a,x){return a+x.price*x.q},0);if(!d.description)d.description=S.cart.map(function(x){return x.name}).join(', ')}try{var os=await api('/orders',{method:'POST',body:JSON.stringify(d)});os.total=os.estimated_cost;S.cart=[];closeModal();await go('atendimento');showPrintPrompt('ORDEM DE SERVIÇO',os)}catch(x){toast(x.message,true)}}}catch(e){toast(e.message,true)}}
async function advance(id){var o=S.orders.find(function(x){return x.id===id}),n=o.status==='pendente'?'em_andamento':o.status==='em_andamento'?'concluido':'pendente';await api('/orders/'+id,{method:'PUT',body:JSON.stringify(Object.assign({},o,{status:n}))});orders()}


async function budgets(){
  S.budgets=await api('/budgets');
  qs('#content').innerHTML=

function budgetItemsToLines(items){
  return (items||[]).map(function(x){return [x.name||'',x.quantity||1,Number(x.unit_price||0)].join(' | ')}).join('\n');
}
function parseBudgetLines(text){
  return String(text||'').split('\n').map(function(l){
    var p=l.split('|').map(function(x){return x.trim()}),name=p[0],qty=+(p[1]||1),price=+(String(p[2]||0).replace(',','.'));
    qty=Math.max(1,qty||1);price=Math.max(0,price||0);
    return name?{name:name,quantity:qty,unit_price:price,total:moneyClient(qty*price)}:null;
  }).filter(Boolean);
}
function moneyClient(v){return Math.round((Number(v)||0)*100)/100}
function refreshBudgetPreview(linesId,previewId,totalId){
  var items=parseBudgetLines(qs('#'+linesId).value),total=items.reduce(function(a,x){return a+x.total},0),preview=qs('#'+previewId);
  if(preview)preview.innerHTML=(items.map(function(x){return '<div class="row"><div><b>'+esc(x.name)+'</b><small>'+x.quantity+' × '+brl(x.unit_price)+'</small></div><b class="gold">'+brl(x.total)+'</b></div>'}).join('')||'<div class="empty">A IA ainda não gerou itens.</div>');
  var t=qs('#'+totalId);if(t)t.textContent=brl(total);
  return {items:items,total:total};
}

function cartAdd(id){
  captureAttDraft();
  var p=S.inventory.find(function(x){return x.id===id}),z=S.cart.find(function(x){return (x.inventory_id||x.id)===id});
  if(!p)return;
  if(z)z.q=Math.min((z.q||1)+1,p.quantity);
  else S.cart.push({id:p.id,inventory_id:p.id,name:p.name,price:+p.price,q:1,stock:p.quantity,manual:false});
  pos();
}
function cartQty(id,v){
  captureAttDraft();
  var x=S.cart.find(function(z){return z.id===id});
  if(x)x.q=Math.max(1,Math.min(x.stock||9999,+v||1));
  pos();
}
function cartRm(id){
  captureAttDraft();
  S.cart=S.cart.filter(function(x){return x.id!==id});
  pos();
}

async function hubAI(){
  captureAttDraft();
  var el=qs('#hubAIText'),txt=el?el.value.trim():'';
  if(!txt)return toast('Descreva o que o cliente precisa.',true);
  var btn=qs('#hubAIButton');if(btn){btn.disabled=true;btn.textContent='IA montando...'}
  try{

    (d.items||[]).forEach(function(x,i){
      var inv=S.inventory.find(function(p){return String(p.name).toLowerCase()===String(x.name||'').toLowerCase()});
      if(inv){
        var z=S.cart.find(function(a){return (a.inventory_id||a.id)===inv.id});
        if(z)z.q=Math.min((z.q||1)+(+x.quantity||1),inv.quantity);
        else S.cart.push({id:inv.id,inventory_id:inv.id,name:inv.name,price:+x.unit_price||+inv.price||0,q:+x.quantity||1,stock:inv.quantity,manual:false});
      }else{
        S.cart.push({id:'ia-'+Date.now()+'-'+i,inventory_id:null,name:x.name||'Serviço',price:+x.unit_price||0,q:+x.quantity||1,stock:9999,manual:true});

  try{
    var r=await api('/attendances/confirm',{method:'POST',body:JSON.stringify(body)});
    S.cart=[];S.attDraft=attDefaults();
    await pos();
    showAttendanceResult(r);
  }catch(e){
    toast(e.message,true);
    if(btn){btn.disabled=false;btn.textContent='CONFIRMAR ATENDIMENTO'}
  }
}
function showAttendanceResult(r){
  S.lastAttendance=r;
  var bits=[];
  if(r.client)bits.push('Cliente cadastrado/atualizado');
  if(r.budget)bits.push('Orçamento criado');
  if(r.order)bits.push('Ordem de serviço criada');
  if(r.sale)bits.push('Venda registrada e estoque baixado');
  modal('Atendimento confirmado','<div class="card"><div class="title"><b>TUDO SALVO</b><span class="badge g">OK</span></div><div id="attResultList" class="list"></div><div id="attResultButtons" style="display:grid;gap:8px;margin-top:12px"></div></div>');
  qs('#attResultList').innerHTML=bits.map(function(x){return '<div class="row"><span>'+esc(x)+'</span><b class="green">✓</b></div>'}).join('');
  var box=qs('#attResultButtons');
  if(r.budget){var b=document.createElement('button');b.className='btn';b.textContent='Imprimir orçamento 80mm';b.onclick=function(){print80('ORÇAMENTO',S.lastAttendance.budget)};box.appendChild(b)}
  if(r.order){var o=document.createElement('button');o.className='btn';o.textContent='Imprimir OS 80mm';o.onclick=function(){print80('ORDEM DE SERVIÇO',S.lastAttendance.order)};box.appendChild(o)}
  if(r.sale){var v=document.createElement('button');v.className='btn red';v.textContent='Imprimir venda 80mm';v.onclick=function(){print80('VENDA',S.lastAttendance.sale)};box.appendChild(v)}
  var f=document.createElement('button');f.className='btn';f.textContent='Fechar';f.onclick=closeModal;box.appendChild(f);
}

async function openAttendHistory(){
  try{
    var data=await Promise.all([api('/budgets'),api('/orders'),api('/sales')]);
    S.budgets=data[0];S.orders=data[1];S.sales=data[2];
    var rows=[];
    S.budgets.forEach(function(x){rows.push({type:'ORÇAMENTO',id:x.id,name:x.client_name||'Sem cliente',detail:[x.plate,x.brand,x.model,(x.items||[]).map(function(i){return i.name}).join(', ')].filter(Boolean).join(' · '),total:+x.grand_total||0,status:x.status,created_at:x.created_at,raw:x})});
    S.orders.forEach(function(x){rows.push({type:'OS',id:x.id,name:x.client_name||x.plate||'Sem cliente',detail:[x.plate,x.brand,x.model,x.description].filter(Boolean).join(' · '),total:+x.final_cost||+x.estimated_cost||0,status:x.status,created_at:x.created_at,raw:x})});
    S.sales.forEach(function(x){rows.push({type:'VENDA',id:x.id,name:x.client_name||'Consumidor',detail:(x.items||[]).map(function(i){return i.name}).join(', '),total:+x.total||0,status:'concluido',created_at:x.created_at,raw:x})});
    rows.sort(function(a,b){return new Date(b.created_at)-new Date(a.created_at)});
    modal('Histórico de atendimentos','<div class="toolbar"><input id="attHistorySearch" class="input" placeholder="Buscar cliente, placa, moto, serviço ou peça"></div><div id="attHistoryRows" class="list"></div>');
    function paint(list){
      var box=qs('#attHistoryRows');
      box.innerHTML=(list.map(function(x){
        var acts='';
        if(x.type==='ORÇAMENTO')acts='<button class="btn" data-edit-budget="'+x.id+'">Editar</button><button class="btn" data-print-budget="'+x.id+'">80mm</button><button class="btn danger" data-del-budget="'+x.id+'">Excluir</button>';
        else if(x.type==='OS')acts='<button class="btn" data-advance-os="'+x.id+'">Avançar</button>';
        else acts='<button class="btn" data-print-sale="'+x.id+'">80mm</button>';
        return '<div class="row"><div style="min-width:0"><small>'+esc(x.type)+' · '+dt(x.created_at)+'</small><b style="display:block">'+esc(x.name)+'</b><small>'+esc(x.detail||'')+'</small></div><div style="text-align:right"><b class="gold">'+brl(x.total)+'</b><div class="actions" style="margin-top:6px">'+acts+'</div></div></div>';
      }).join('')||'<div class="empty">Nenhum atendimento encontrado.</div>');
      box.querySelectorAll('[data-edit-budget]').forEach(function(b){b.onclick=function(){editBudget(b.dataset.editBudget)}});
      box.querySelectorAll('[data-print-budget]').forEach(function(b){b.onclick=function(){printBudget80(b.dataset.printBudget)}});
      box.querySelectorAll('[data-del-budget]').forEach(function(b){b.onclick=async function(){var id=b.dataset.delBudget;if(!confirm('Excluir este orçamento?'))return;await api('/budgets/'+id,{method:'DELETE'});toast('Orçamento excluído.');openAttendHistory()}});
      box.querySelectorAll('[data-advance-os]').forEach(function(b){b.onclick=async function(){var id=b.dataset.advanceOs,o=S.orders.find(function(x){return x.id===id});if(!o)return;var n=o.status==='pendente'?'em_andamento':o.status==='em_andamento'?'concluido':'pendente';await api('/orders/'+id,{method:'PUT',body:JSON.stringify(Object.assign({},o,{status:n}))});toast('OS atualizada.');openAttendHistory()}});
      box.querySelectorAll('[data-print-sale]').forEach(function(b){b.onclick=function(){var s=S.sales.find(function(x){return x.id===b.dataset.printSale});if(s)print80('VENDA',s)}});
    }
    paint(rows);
    qs('#attHistorySearch').oninput=function(e){var t=e.target.value.toLowerCase().trim();paint(!t?rows:rows.filter(function(x){return JSON.stringify(x).toLowerCase().includes(t)}))};
  }catch(e){toast(e.message,true)}
}

async function finishSale(){if(!S.cart.length)return toast('Carrinho vazio.',true);var cid=qs('#saleClient').value,cl=S.clients.find(function(x){return x.id===cid});try{var sale=await api('/sales',{method:'POST',body:JSON.stringify({client_name:cl?cl.name:'',items:S.cart.map(function(x){return {inventory_id:x.manual?null:(x.inventory_id||x.id),name:x.name,quantity:x.q,unit_price:x.price,type:x.manual?'servico':'produto'}}),discount:+qs('#discount').value||0,payment_method:qs('#payment').value})});S.cart=[];await pos();showPrintPrompt('VENDA',sale)}catch(e){toast(e.message,true)}}


async function createPDVBudget(){
  if(!S.cart.length)return toast('Carrinho vazio.',true);
  var cid=qs('#saleClient').value,cl=S.clients.find(function(x){return x.id===cid});
  var items=S.cart.map(function(x){return {inventory_id:x.manual?null:(x.inventory_id||x.id),name:x.name,quantity:x.q,unit_price:+x.price,total:moneyClient(x.q*x.price),type:x.manual?'servico':'produto'}});
  var total=items.reduce(function(a,x){return a+x.total},0);
  modal('Salvar orçamento do atendimento',
    '<form id="pdvBudgetForm" class="form">'+
    '<div class="field"><label>Cliente</label><input class="input" name="client_name" value="'+esc(cl?cl.name:'')+'" placeholder="Nome do cliente"></div>'+
    '<div class="field"><label>Placa</label><div class="plateScan" id="pdvBudgetScan"><div style="display:flex;gap:6px"><input class="input" id="pdvBudgetPlate" name="plate" maxlength="7" placeholder="ABC1D23"><button class="btn" type="button" id="pdvBudgetLookup">Consultar</button></div></div></div>'+
    '<div class="field"><label>Marca</label><input class="input" name="brand" id="pdvBudgetBrand"></div>'+
    '<div class="field"><label>Modelo</label><input class="input" name="model" id="pdvBudgetModel"></div>'+
    '<div class="field"><label>Ano</label><input class="input" name="year" id="pdvBudgetYear"></div>'+
    '<div class="field"><label>Cor</label><input class="input" name="color" id="pdvBudgetColor"></div>'+
    '<div id="pdvBudgetVehicle" class="span scanResult muted">A placa é opcional. Se informar, o sistema tenta puxar a moto.</div>'+
    '<div class="span list">'+items.map(function(x){return '<div class="row"><div><b>'+esc(x.name)+'</b><small>'+x.quantity+' × '+brl(x.unit_price)+'</small></div><b>'+brl(x.total)+'</b></div>'}).join('')+'</div>'+
    '<div class="span row"><b>Total do orçamento</b><b class="gold">'+brl(total)+'</b></div>'+
    '<button class="btn red span">Salvar orçamento e preparar impressão</button></form>');
  qs('#pdvBudgetLookup').onclick=async function(){
    var p=qs('#pdvBudgetPlate').value.trim(),scan=qs('#pdvBudgetScan'),btn=qs('#pdvBudgetLookup'),res=qs('#pdvBudgetVehicle');
    if(p.length<7)return toast('Digite a placa completa.',true);
    scan.classList.add('scanning');btn.textContent='Buscando...';
    try{
      var d=await api('/vehicle/'+p);
      if(d.found){
        qs('#pdvBudgetBrand').value=d.brand||'';
        qs('#pdvBudgetModel').value=d.model||'';
        qs('#pdvBudgetYear').value=d.year||'';
        qs('#pdvBudgetColor').value=d.color||'';
        res.textContent='Moto localizada: '+[d.brand,d.model,d.year,d.color].filter(Boolean).join(' · ');
      }else res.textContent=d.message||'Veículo não localizado.';
    }catch(e){toast(e.message,true)}
    finally{scan.classList.remove('scanning');btn.textContent='Consultar'}
  };
  qs('#pdvBudgetForm').onsubmit=async function(e){
    e.preventDefault();
    var d=Object.fromEntries(new FormData(e.target));
    d.items=items;d.grand_total=total;d.status='aberto';
    try{
      var saved=await api('/budgets',{method:'POST',body:JSON.stringify(d)});
      S.cart=[];
      closeModal();
      await go('atendimento');
      showPrintPrompt('ORÇAMENTO',saved);
    }catch(x){toast(x.message,true)}
  };
}
function printBudget80(id){
  var b=S.budgets.find(function(x){return x.id===id});
  if(!b)return toast('Orçamento não encontrado.',true);
  print80('ORÇAMENTO',b);
}
function showPrintPrompt(type,data){
  S.printJob={type:type,data:data};
  var total=Number(data.total!=null?data.total:(data.grand_total!=null?data.grand_total:(data.final_cost||data.estimated_cost||0)));
  modal(type==='VENDA'?'Venda concluída':(type==='ORDEM DE SERVIÇO'?'OS aberta':'Orçamento salvo'),
    '<div class="card"><div class="title"><b>'+type+' PRONTO</b><span class="badge g">80 MM</span></div>'+
    '<div class="row"><span>Total</span><b class="gold">'+brl(total)+'</b></div>'+
    '<p class="muted">O documento está salvo. Toque abaixo para imprimir na térmica de 80 mm.</p>'+
    '<div style="display:grid;gap:8px"><button class="btn red full" onclick="printCurrent80()">Imprimir 80 mm</button><button class="btn full" onclick="closeModal()">Fechar</button></div></div>');
}
function printCurrent80(){
  if(!S.printJob)return toast('Nenhum documento para imprimir.',true);
  print80(S.printJob.type,S.printJob.data);
}
function testPrint80(){
  print80('TESTE',{id:'TESTE-80MM',client_name:'Cliente de teste',items:[{name:'Óleo 10W40',quantity:1,unit_price:39.9,total:39.9},{name:'Filtro de óleo',quantity:1,unit_price:18,total:18}],total:57.9,grand_total:57.9,payment_method:'pix',created_at:new Date().toISOString()});
}
function print80(type,data){
  var items=Array.isArray(data.items)?data.items:[];
  var total=Number(data.total!=null?data.total:(data.grand_total!=null?data.grand_total:(data.final_cost||data.estimated_cost||0)));
  var subtotal=Number(data.subtotal!=null?data.subtotal:total);
  var discount=Number(data.discount||0);
  var vehicle=[data.brand,data.model,data.year,data.color].filter(Boolean).join(' · ');
  var rows=items.map(function(x){
    var qty=Number(x.quantity||1),unit=Number(x.unit_price||0),line=Number(x.total!=null?x.total:qty*unit);
    return '<div class="item"><b>'+esc(x.name||'Item')+'</b><div class="line"><span>'+qty+' x '+brl(unit)+'</span><b>'+brl(line)+'</b></div></div>';
  }).join('');
  var w=window.open('','_blank','width=420,height=720');
  if(!w)return toast('Permita pop-ups para imprimir.',true);
  var out=[];
  out.push('<!doctype html><html><head><meta charset="utf-8"><title>MF Moto Peças</title><style>');
  out.push('@page{size:80mm auto;margin:3mm}*{box-sizing:border-box}body{width:74mm;margin:0 auto;color:#000;background:#fff;font:12px/1.35 Arial,sans-serif}.center{text-align:center}.brand{font-size:20px;font-weight:900}.sub{font-size:10px}.dash{border-top:1px dashed #000;margin:8px 0}.line{display:flex;justify-content:space-between;gap:8px}.item{margin:7px 0}.total{font-size:17px;font-weight:900}.muted{font-size:10px}.printBtn{display:block;margin:12px 0;padding:10px;width:100%}@media print{.printBtn{display:none}body{width:74mm}}');
  out.push('</style></head><body>');
  out.push('<div class="center brand">MF MOTO PEÇAS</div>');
  out.push('<div class="center sub">MAIS QUE PEÇAS, É PAIXÃO SOBRE DUAS RODAS.</div>');
  out.push('<div class="dash"></div><b>'+esc(type)+'</b>');
  out.push('<div class="muted">Código: '+esc(String(data.id||'').slice(0,14))+'</div>');
  out.push('<div class="muted">Data: '+new Date(data.created_at||Date.now()).toLocaleString('pt-BR')+'</div>');
  if(data.client_name)out.push('<div>Cliente: <b>'+esc(data.client_name)+'</b></div>');
  if(data.plate)out.push('<div>Placa: <b>'+esc(data.plate)+'</b></div>');
  if(vehicle)out.push('<div>Moto: '+esc(vehicle)+'</div>');
  out.push('<div class="dash"></div>'+rows+'<div class="dash"></div>');
  if(type==='VENDA'){
    out.push('<div class="line"><span>Subtotal</span><span>'+brl(subtotal)+'</span></div>');
    if(discount)out.push('<div class="line"><span>Desconto</span><span>- '+brl(discount)+'</span></div>');
  }
  out.push('<div class="line total"><span>TOTAL</span><span>'+brl(total)+'</span></div>');
  if(data.payment_method)out.push('<div>Pagamento: '+esc(String(data.payment_method).toUpperCase())+'</div>');
  out.push('<div class="dash"></div><div class="center muted">Documento gerado pelo MF Moto Peças</div>');
  out.push('<button class="printBtn" onclick="window.print()">IMPRIMIR 80 MM</button>');
  out.push('</body></html>');
  w.document.open();w.document.write(out.join(''));w.document.close();
}

async function security(){
  var me=await api('/me');
  qs('#content').innerHTML=
    hero('SEGURANÇA','Controle de acesso da central MF.','<button class="btn" onclick="testPrint80()">Testar impressora 80mm</button><button class="btn" onclick="logout()">Encerrar sessão</button>')+
    '<div class="securityGrid">'+
      '<div class="card securityMark"><div><div class="lockCore">⌾</div><div style="text-align:center;margin-top:14px"><b>'+esc(me.name||'Usuário MF')+'</b><small style="display:block;color:#777">'+esc(me.email||'')+'</small></div></div></div>'+
      '<div class="card"><div class="title"><b>ALTERAR SENHA</b><span class="badge g">ACESSO PROTEGIDO</span></div>'+
        '<div class="securityNote">Cada e-mail possui uma conta própria. Clientes, estoque, OS, orçamentos, vendas e documentos ficam isolados por usuário. Sua senha é armazenada com hash e não aparece no painel.</div>'+
        '<form id="passwordForm" style="margin-top:12px">'+
          '<div class="field"><label>Senha atual</label><div class="passWrap"><input id="currentPassword" name="current_password" class="input" type="password" autocomplete="current-password" required><button class="btn passToggle" type="button" onclick="togglePass(\'currentPassword\',this)">Mostrar</button></div></div>'+
          '<div class="field"><label>Nova senha</label><div class="passWrap"><input id="newPassword" name="new_password" class="input" type="password" minlength="8" autocomplete="new-password" required><button class="btn passToggle" type="button" onclick="togglePass(\'newPassword\',this)">Mostrar</button></div></div>'+
          '<div class="field"><label>Confirmar nova senha</label><div class="passWrap"><input id="confirmPassword" class="input" type="password" minlength="8" autocomplete="new-password" required><button class="btn passToggle" type="button" onclick="togglePass(\'confirmPassword\',this)">Mostrar</button></div></div>'+
          '<button class="btn red full">Atualizar senha</button>'+
        '</form>'+
      '</div>'+
    '</div>';
  qs('#passwordForm').onsubmit=async function(e){
    e.preventDefault();
    var cur=qs('#currentPassword').value,n=qs('#newPassword').value,cf=qs('#confirmPassword').value;
    if(n!==cf)return toast('As novas senhas não conferem.',true);
    try{
      await api('/auth/password',{method:'POST',body:JSON.stringify({current_password:cur,new_password:n})});
      e.target.reset();
      toast('Senha alterada com sucesso.');
    }catch(x){toast(x.message,true)}
  }
}
async function fiscal(){S.fiscal=await api('/fiscal');S.sales=await api('/sales');qs('#content').innerHTML=hero('FISCAL','Rascunhos e emissão via provedor autorizado.','<button class="btn red" onclick="openFiscal()">+ Nova nota</button>')+'<div class="warn"><b>Emissão correta:</b> sem credenciais de provedor fiscal/SEFAZ, o documento permanece em rascunho. Só aparece como emitido após autorização real.</div><div class="tableWrap"><table class="table"><thead><tr><th>Tipo</th><th>Cliente</th><th>Total</th><th>Status</th><th>Chave/ref.</th><th></th></tr></thead><tbody>'+(S.fiscal.map(function(f){return '<tr><td><b>'+esc(f.type)+'</b></td><td>'+esc(f.client_name||'Consumidor')+'</td><td>'+brl(f.total)+'</td><td>'+badge(f.status)+'</td><td><small>'+esc(f.access_key||f.provider_ref||'-')+'</small></td><td>'+(f.status==='rascunho'?'<button class="btn" onclick="issueFiscal(\''+f.id+'\')">Emitir</button>':'')+'</td></tr>'}).join('')||'<tr><td colspan="6" class="empty">Nenhum documento.</td></tr>')+'</tbody></table></div>'}
function openFiscal(){modal('Novo documento fiscal','<form id="fiscalForm" class="form"><div class="field"><label>Venda</label><select name="sale_id" id="fiscalSale"><option value="">Avulsa</option>'+S.sales.map(function(s){return '<option value="'+s.id+'">'+dt(s.created_at)+' · '+brl(s.total)+'</option>'}).join('')+'</select></div><div class="field"><label>Tipo</label><select name="type"><option>NFC-e</option><option>NF-e</option><option>NFS-e</option></select></div><div class="field"><label>Cliente</label><input id="fiscalClient" class="input" name="client_name"></div><div class="field"><label>CPF/CNPJ</label><input class="input" name="client_document"></div><div class="field span"><label>Total</label><input id="fiscalTotal" class="input" type="number" step=".01" name="total" required></div><textarea id="fiscalItems" class="hide" name="items">[]</textarea><button class="btn red span">Salvar rascunho</button></form>');qs('#fiscalSale').onchange=function(e){var s=S.sales.find(function(x){return x.id===e.target.value});if(s){qs('#fiscalClient').value=s.client_name||'';qs('#fiscalTotal').value=s.total;qs('#fiscalItems').value=JSON.stringify(s.items||[])}};qs('#fiscalForm').onsubmit=async function(e){e.preventDefault();var d=Object.fromEntries(new FormData(e.target));d.items=JSON.parse(d.items||'[]');try{await api('/fiscal',{method:'POST',body:JSON.stringify(d)});closeModal();toast('Rascunho fiscal criado.');fiscal()}catch(x){toast(x.message,true)}}}
async function issueFiscal(id){try{await api('/fiscal/'+id+'/issue',{method:'POST'});toast('Documento autorizado.');fiscal()}catch(e){toast(e.message,true)}}
if(S.token)boot();else{showApp(false);loadRegistrationStatus()}
</script>
