<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070707">
<title>MF Moto Peças • Gestão</title>
<style>
:root{--red:#ef1016;--bg:#070707;--panel:#111;--panel2:#171717;--line:#292929;--text:#f6f6f6;--muted:#929292;--gold:#ffd24d;--green:#34d17c}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 88% 0,#300708 0,transparent 30%),var(--bg);color:var(--text);font:500 14px/1.45 Inter,system-ui,-apple-system,Segoe UI,sans-serif}
button,input,select,textarea{font:inherit}.hide{display:none!important}.btn{border:1px solid var(--line);background:#181818;color:#fff;border-radius:11px;padding:10px 13px;font-weight:800;cursor:pointer}.btn.red{background:linear-gradient(135deg,var(--red),#a9060b);border:0}.btn.danger{color:#ff777c;background:#200b0c;border-color:#481719}.btn:active{transform:translateY(1px)}.input,select,textarea{width:100%;border:1px solid var(--line);background:#090909;color:#fff;border-radius:11px;padding:11px 12px;outline:none}.input:focus,select:focus,textarea:focus{border-color:var(--red)}textarea{min-height:82px;resize:vertical}
.login{min-height:100vh;display:grid;place-items:center;padding:22px}.loginCard{width:min(430px,100%);background:linear-gradient(180deg,#121212,#0b0b0b);border:1px solid #292929;border-radius:26px;padding:27px;box-shadow:0 30px 100px #000}
.brand{display:flex;align-items:center;gap:12px}.mf{font-size:31px;font-weight:1000;font-style:italic;letter-spacing:-4px;position:relative;padding:0 9px;isolation:isolate}.mf:after{content:"";position:absolute;left:0;right:0;bottom:3px;height:9px;background:var(--red);z-index:-1;transform:skewX(-25deg)}.brand b{font-size:17px;letter-spacing:.5px}.brand small{display:block;color:#858585;letter-spacing:2px;font-size:9px}.login h1{font-size:32px;line-height:.98;margin:30px 0 9px}.redtxt{color:var(--red)}.muted{color:var(--muted)}.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:10px;color:#858585;text-transform:uppercase;letter-spacing:1.4px}.tabs{display:flex;padding:4px;border:1px solid var(--line);background:#090909;border-radius:12px;margin:17px 0}.tabs button{flex:1;background:none;border:0;color:#777;padding:8px;border-radius:9px}.tabs .on{background:#1d1d1d;color:#fff}.full{width:100%}
.app{display:grid;grid-template-columns:238px 1fr;min-height:100vh}.side{height:100vh;position:sticky;top:0;border-right:1px solid #222;padding:18px 12px;background:#090909}.nav{display:grid;gap:5px;margin-top:24px}.nav button{border:1px solid transparent;background:none;color:#999;text-align:left;padding:11px;border-radius:11px;cursor:pointer}.nav button.on{color:#fff;background:#280b0d;border-color:#4d181b}.main{min-width:0}.top{height:66px;position:sticky;top:0;z-index:25;display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:#090909e8;backdrop-filter:blur(15px);border-bottom:1px solid #222}.content{padding:22px;max-width:1450px;margin:auto}.hero{display:flex;justify-content:space-between;align-items:end;gap:15px;margin-bottom:18px}.hero h1{font-size:38px;line-height:.95;margin:5px 0;text-transform:uppercase}.eyebrow{font-size:10px;color:var(--red);letter-spacing:2px}.actions{display:flex;gap:8px;flex-wrap:wrap}
.grid{display:grid;gap:12px}.stats{grid-template-columns:repeat(6,1fr)}.card{background:linear-gradient(180deg,#131313,#0d0d0d);border:1px solid #262626;border-radius:16px;padding:15px}.stat b{font-size:28px}.stat small{display:block;color:#777}.two{grid-template-columns:1.2fr .8fr}.title{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.list{display:grid;gap:7px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid #252525;background:#0b0b0b;padding:11px;border-radius:11px}.row small{display:block;color:#777}
.badge{display:inline-block;font-size:10px;border:1px solid #353535;border-radius:999px;padding:4px 7px;color:#aaa;white-space:nowrap}.badge.r{color:#ff7378;border-color:#5e1b1f}.badge.g{color:#6ae8a2;border-color:#1f5439}.badge.y{color:#ffe085;border-color:#554817}.toolbar{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:12px}.toolbar .input{max-width:430px}.tableWrap{overflow:auto;border:1px solid #252525;border-radius:14px}.table{width:100%;min-width:720px;border-collapse:collapse;background:#0c0c0c}.table th,.table td{padding:11px;border-bottom:1px solid #202020;text-align:left}.table th{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#777;background:#111}.money{font-weight:900}.gold{color:var(--gold)}.green{color:var(--green)}.empty{text-align:center;color:#666;padding:28px}.warn{border:1px solid #55491f;background:#1b1709;color:#d7c776;border-radius:12px;padding:11px;margin-bottom:12px}
.modal{position:fixed;inset:0;z-index:90;display:grid;place-items:center;background:#000c;backdrop-filter:blur(7px);padding:15px}.modalCard{width:min(720px,100%);max-height:92vh;overflow:auto;background:#101010;border:1px solid #333;border-radius:18px}.modalHead{padding:14px 16px;border-bottom:1px solid #252525;display:flex;justify-content:space-between;align-items:center}.modalBody{padding:16px}.form{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.span{grid-column:1/-1}.products{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.product{border:1px solid #292929;background:#0c0c0c;padding:12px;border-radius:12px;cursor:pointer}.product:hover{border-color:#852228}.product small{display:block;color:#777}.product .price{color:var(--gold);font-weight:900;margin-top:6px}.posgrid{display:grid;grid-template-columns:1fr .72fr;gap:14px}.cartline{display:grid;grid-template-columns:1fr 65px 32px;gap:7px;align-items:center;padding:9px 0;border-bottom:1px solid #222}.ai{border:1px solid #4b1719;background:#180708;border-radius:15px;padding:13px;margin-bottom:13px}.chat{max-height:260px;overflow:auto;display:grid;gap:7px;margin:9px 0}.bubble{white-space:pre-wrap;background:#191919;border-radius:11px;padding:9px}.bubble.me{background:#2a0d0e;margin-left:10%}.toast{position:fixed;right:18px;bottom:18px;z-index:120;background:#151515;border:1px solid #333;border-radius:11px;padding:11px 14px}.mobile{display:none}
@media(max-width:1050px){.stats{grid-template-columns:repeat(3,1fr)}.two,.posgrid{grid-template-columns:1fr}}
@media(max-width:760px){.app{display:block}.side{display:none}.top{height:58px;padding:0 11px}.content{padding:14px 10px 80px}.hero{align-items:flex-start;flex-direction:column}.hero h1{font-size:31px}.stats{grid-template-columns:repeat(2,1fr)}.form{grid-template-columns:1fr}.span{grid-column:auto}.products{grid-template-columns:1fr}.mobile{display:flex;position:fixed;left:7px;right:7px;bottom:7px;z-index:60;background:#111e;border:1px solid #292929;border-radius:14px;padding:5px;overflow:auto;backdrop-filter:blur(14px)}.mobile button{flex:0 0 62px;border:0;background:none;color:#777;padding:7px 2px;font-size:9px}.mobile button.on{background:#2b0d0f;color:#fff;border-radius:9px}}
</style>
</head>
<body>
<section id="login" class="login">
<div class="loginCard">
<div class="brand"><div class="mf">MF</div><div><b>MF MOTO PEÇAS</b><small>CENTRAL DE OPERAÇÕES</small></div></div>
<h1>A LOJA ACELERA.<br><span class="redtxt">VOCÊ CONTROLA.</span></h1>
<p class="muted">Vendas, peças e motos organizadas em uma operação só.</p>
<div class="tabs"><button id="tabLogin" class="on">Entrar</button><button id="tabRegister">Criar acesso</button></div>
<form id="authForm">
<div id="nameField" class="field hide"><label>Nome</label><input id="authName" class="input"></div>
<div class="field"><label>E-mail</label><input id="authEmail" class="input" type="email" required></div>
<div class="field"><label>Senha</label><input id="authPass" class="input" type="password" minlength="6" required></div>
<button id="authSubmit" class="btn red full">ENTRAR NA CENTRAL</button>
<div id="authError" class="redtxt"></div>
</form>
</div>
</section>
<div id="app" class="app hide">
<aside class="side"><div class="brand"><div class="mf">MF</div><div><b>MF MOTO PEÇAS</b><small>GESTÃO</small></div></div><nav id="nav" class="nav"></nav></aside>
<main class="main"><header class="top"><span>MF / <b id="crumb">VISÃO GERAL</b></span><div class="actions"><button class="btn" onclick="openOrder()">+ Abrir OS</button><button class="btn" onclick="logout()">Sair</button></div></header><div id="content" class="content"></div></main>
<nav id="mobileNav" class="mobile"></nav>
</div>
<div id="modal" class="modal hide"></div><div id="toast" class="toast hide"></div>
<script>
var NAV=[['overview','⌁','Visão geral'],['pos','▣','PDV'],['inventory','▦','Estoque'],['orders','⚙','Ordens'],['budgets','◇','Orçamentos'],['clients','♙','Clientes'],['fiscal','§','Fiscal']];
var S={token:localStorage.mf_token||'',page:'overview',clients:[],inventory:[],orders:[],budgets:[],sales:[],fiscal:[],cart:[],chat:[]};
function qs(s){return document.querySelector(s)}function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]})}
function brl(n){return Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}function dt(d){return d?new Date(d).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'}):'-'}
function toast(t,err){var x=qs('#toast');x.textContent=t;x.style.borderColor=err?'#6b1e22':'#285b3e';x.classList.remove('hide');setTimeout(function(){x.classList.add('hide')},3000)}
async function api(url,opt){opt=opt||{};var h=Object.assign({'content-type':'application/json'},opt.headers||{});if(S.token)h.authorization='Bearer '+S.token;var r=await fetch('/api'+url,Object.assign({},opt,{headers:h})),d={};try{d=await r.json()}catch(e){}if(!r.ok){if(r.status===401&&S.token)logout();throw Error(d.error||'Erro na operação')}return d}
function showApp(ok){qs('#login').classList.toggle('hide',ok);qs('#app').classList.toggle('hide',!ok)}function logout(){localStorage.removeItem('mf_token');S.token='';showApp(false)}
var authMode='login';function authModeSet(m){authMode=m;qs('#tabLogin').classList.toggle('on',m==='login');qs('#tabRegister').classList.toggle('on',m==='register');qs('#nameField').classList.toggle('hide',m==='login');qs('#authSubmit').textContent=m==='login'?'ENTRAR NA CENTRAL':'CRIAR ACESSO'}
qs('#tabLogin').onclick=function(){authModeSet('login')};qs('#tabRegister').onclick=function(){authModeSet('register')};
qs('#authForm').onsubmit=async function(e){e.preventDefault();try{var body={name:qs('#authName').value,email:qs('#authEmail').value,password:qs('#authPass').value};var d=await api('/auth/'+(authMode==='login'?'login':'register'),{method:'POST',body:JSON.stringify(body)});S.token=d.token;localStorage.mf_token=S.token;await boot()}catch(x){qs('#authError').textContent=x.message}};
function navs(){var a=NAV.map(function(n){return '<button data-page="'+n[0]+'" class="'+(S.page===n[0]?'on':'')+'">'+n[1]+' '+n[2]+'</button>'}).join('');qs('#nav').innerHTML=a;qs('#mobileNav').innerHTML=a;document.querySelectorAll('[data-page]').forEach(function(b){b.onclick=function(){go(b.dataset.page)}})}
async function boot(){showApp(true);navs();await go('overview')}async function go(p){S.page=p;navs();var n=NAV.find(function(x){return x[0]===p});qs('#crumb').textContent=(n?n[2]:p).toUpperCase();var fn={overview:overview,pos:pos,inventory:inventory,orders:orders,budgets:budgets,clients:clients,fiscal:fiscal}[p];if(fn)try{await fn()}catch(e){toast(e.message,true)}}
function hero(t,s,a){return '<div class="hero"><div><div class="eyebrow">MF / CENTRAL DE OPERAÇÕES</div><h1>'+t+'</h1><div class="muted">'+s+'</div></div><div class="actions">'+(a||'')+'</div></div>'}
function badge(s){var c=s==='concluido'||s==='emitida'?'g':s==='pendente'||s==='rascunho'?'y':'r';return '<span class="badge '+c+'">'+esc(String(s||'-').replaceAll('_',' '))+'</span>'}
function modal(title,html){qs('#modal').innerHTML='<div class="modalCard"><div class="modalHead"><b>'+esc(title)+'</b><button class="btn" onclick="closeModal()">×</button></div><div class="modalBody">'+html+'</div></div>';qs('#modal').classList.remove('hide')}function closeModal(){qs('#modal').classList.add('hide');qs('#modal').innerHTML=''}
async function del(url,back){if(!confirm('Excluir este registro?'))return;try{await api(url,{method:'DELETE'});toast('Excluído.');back()}catch(e){toast(e.message,true)}}
async function overview(){var d=await api('/dashboard'),o=await api('/orders');qs('#content').innerHTML=hero('VISÃO GERAL','A loja acelera. Você controla.','<button class="btn red" onclick="openOrder()">+ Abrir ordem de serviço</button>')+'<div class="grid stats">'+[['Vendas hoje',brl(d.today_sales)],['Ordens abertas',d.open_orders],['Produtos',d.inventory],['Clientes',d.clients],['Orçamentos',d.budgets],['Estoque baixo',d.low_stock]].map(function(x){return '<div class="card stat"><small>'+x[0]+'</small><b>'+x[1]+'</b></div>'}).join('')+'</div><div class="grid two" style="margin-top:12px"><div class="card"><div class="title"><b>ORDENS RECENTES</b><button class="btn" onclick="go(\'orders\')">Ver todas</button></div><div class="list">'+(o.slice(0,6).map(function(x){return '<div class="row"><div><b>'+esc(x.client_name||x.plate)+'</b><small>'+esc([x.brand,x.model,x.plate].filter(Boolean).join(' · '))+'</small></div>'+badge(x.status)+'</div>'}).join('')||'<div class="empty">Nenhuma moto na oficina ainda.</div>')+'</div></div><div class="card"><div class="title"><b>ACESSO RÁPIDO</b></div><div class="list"><button class="btn" onclick="go(\'inventory\')">Cadastrar peça →</button><button class="btn" onclick="go(\'budgets\')">Criar orçamento →</button><button class="btn" onclick="go(\'pos\')">Nova venda →</button><button class="btn" onclick="openOrder()">Abrir OS →</button></div></div></div>'}
async function clients(){S.clients=await api('/clients');qs('#content').innerHTML=hero('CLIENTES','Cadastro e histórico da oficina.','<button class="btn red" onclick="openClient()">+ Novo cliente</button>')+'<div class="toolbar"><input id="clientSearch" class="input" placeholder="Buscar cliente"></div><div class="tableWrap"><table class="table"><thead><tr><th>Nome</th><th>Telefone</th><th>E-mail</th><th>CPF/CNPJ</th><th></th></tr></thead><tbody id="clientRows"></tbody></table></div>';function paint(v){qs('#clientRows').innerHTML=(v.map(function(c){return '<tr><td><b>'+esc(c.name)+'</b></td><td>'+esc(c.phone)+'</td><td>'+esc(c.email)+'</td><td>'+esc(c.cpf_cnpj)+'</td><td><button class="btn danger" onclick="del(\'/clients/'+c.id+'\',clients)">Excluir</button></td></tr>'}).join('')||'<tr><td colspan="5" class="empty">Nenhum cliente.</td></tr>')}paint(S.clients);qs('#clientSearch').oninput=function(e){var x=e.target.value.toLowerCase();paint(S.clients.filter(function(c){return JSON.stringify(c).toLowerCase().includes(x)}))}}
function openClient(){modal('Novo cliente','<form id="clientForm" class="form"><div class="field"><label>Nome</label><input name="name" class="input" required></div><div class="field"><label>Telefone</label><input name="phone" class="input"></div><div class="field"><label>E-mail</label><input name="email" type="email" class="input"></div><div class="field"><label>CPF/CNPJ</label><input name="cpf_cnpj" class="input"></div><button class="btn red span">Salvar cliente</button></form>');qs('#clientForm').onsubmit=async function(e){e.preventDefault();try{await api('/clients',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});closeModal();toast('Cliente salvo.');clients()}catch(x){toast(x.message,true)}}}
async function inventory(){S.inventory=await api('/inventory');qs('#content').innerHTML=hero('ESTOQUE','Peças, quantidades, preços e compatibilidade.','<button class="btn red" onclick="openItem()">+ Cadastrar peça</button>')+'<div class="toolbar"><input id="invSearch" class="input" placeholder="Buscar peça, SKU ou modelo"></div><div class="tableWrap"><table class="table"><thead><tr><th>Produto</th><th>Compatível</th><th>Qtd.</th><th>Custo</th><th>Venda</th><th></th></tr></thead><tbody id="invRows"></tbody></table></div>';function paint(v){qs('#invRows').innerHTML=(v.map(function(x){return '<tr><td><b>'+esc(x.name)+'</b><br><small>'+esc(x.sku||x.category||'')+'</small></td><td>'+esc((x.moto_models||[]).join(', '))+'</td><td class="'+(x.is_low_stock?'redtxt':'')+'"><b>'+x.quantity+'</b> / mín '+x.min_quantity+'</td><td>'+brl(x.cost)+'</td><td class="gold money">'+brl(x.price)+'</td><td><button class="btn danger" onclick="del(\'/inventory/'+x.id+'\',inventory)">Excluir</button></td></tr>'}).join('')||'<tr><td colspan="6" class="empty">Nenhum item cadastrado.</td></tr>')}paint(S.inventory);qs('#invSearch').oninput=function(e){var x=e.target.value.toLowerCase();paint(S.inventory.filter(function(i){return JSON.stringify(i).toLowerCase().includes(x)}))}}
function openItem(){modal('Cadastrar peça','<form id="itemForm" class="form"><div class="field"><label>Nome</label><input name="name" class="input" required></div><div class="field"><label>SKU/Código</label><input name="sku" class="input"></div><div class="field"><label>Categoria</label><input name="category" class="input"></div><div class="field"><label>Modelos compatíveis</label><input name="moto_models" class="input" placeholder="PCX 150, CG 160"></div><div class="field"><label>Quantidade</label><input name="quantity" type="number" min="0" class="input" value="0"></div><div class="field"><label>Estoque mínimo</label><input name="min_quantity" type="number" min="0" class="input" value="3"></div><div class="field"><label>Custo</label><input name="cost" type="number" step=".01" class="input"></div><div class="field"><label>Preço de venda</label><input name="price" type="number" step=".01" class="input"></div><button class="btn red span">Cadastrar peça</button></form>');qs('#itemForm').onsubmit=async function(e){e.preventDefault();try{await api('/inventory',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});closeModal();toast('Peça cadastrada.');inventory()}catch(x){toast(x.message,true)}}}
async function orders(){S.orders=await api('/orders');qs('#content').innerHTML=hero('ORDENS DE SERVIÇO','Entrada, consulta de placa e andamento da oficina.','<button class="btn red" onclick="openOrder()">+ Abrir OS</button>')+'<div class="tableWrap"><table class="table"><thead><tr><th>Moto</th><th>Cliente</th><th>Serviço</th><th>Valor</th><th>Status</th><th></th></tr></thead><tbody>'+(S.orders.map(function(o){return '<tr><td><b>'+esc([o.brand,o.model].filter(Boolean).join(' ')||o.plate)+'</b><br><small>'+esc(o.plate)+' · '+esc(o.year||'')+' '+esc(o.color||'')+'</small></td><td>'+esc(o.client_name||'-')+'</td><td>'+esc(o.description)+'</td><td>'+brl(o.final_cost||o.estimated_cost)+'</td><td>'+badge(o.status)+'</td><td><button class="btn" onclick="advance(\''+o.id+'\')">Avançar</button> <button class="btn danger" onclick="del(\'/orders/'+o.id+'\',orders)">Excluir</button></td></tr>'}).join('')||'<tr><td colspan="6" class="empty">Nenhuma OS.</td></tr>')+'</tbody></table></div>'}
async function openOrder(){try{S.clients=await api('/clients');modal('Abrir ordem de serviço','<form id="orderForm" class="form"><div class="field"><label>Cliente</label><select name="client_id" id="orderClient"><option value="">Sem cliente</option>'+S.clients.map(function(c){return '<option value="'+c.id+'">'+esc(c.name)+'</option>'}).join('')+'</select></div><div class="field"><label>Placa</label><div style="display:flex;gap:6px"><input class="input" name="plate" id="plateInput" required><button class="btn" type="button" id="plateLookup">Consultar</button></div></div><div class="field"><label>Marca</label><input class="input" name="brand" id="brandInput"></div><div class="field"><label>Modelo</label><input class="input" name="model" id="modelInput"></div><div class="field"><label>Ano</label><input class="input" name="year" id="yearInput"></div><div class="field"><label>Cor</label><input class="input" name="color" id="colorInput"></div><div class="field span"><label>Serviço/queixa</label><textarea name="description" required></textarea></div><div class="field"><label>Estimativa</label><input class="input" name="estimated_cost" type="number" step=".01"></div><div class="field"><label>Status</label><select name="status"><option value="pendente">Pendente</option><option value="em_andamento">Em andamento</option></select></div><div id="plateResult" class="muted span"></div><button class="btn red span">Criar OS</button></form>');qs('#plateLookup').onclick=async function(){try{var d=await api('/vehicle/'+qs('#plateInput').value);qs('#plateResult').textContent=d.found?'Encontrado: '+[d.brand,d.model,d.year,d.color].filter(Boolean).join(' · '):d.message;if(d.found){qs('#brandInput').value=d.brand||'';qs('#modelInput').value=d.model||'';qs('#yearInput').value=d.year||'';qs('#colorInput').value=d.color||''}}catch(e){toast(e.message,true)}};qs('#orderForm').onsubmit=async function(e){e.preventDefault();var d=Object.fromEntries(new FormData(e.target));var c=S.clients.find(function(x){return x.id===d.client_id});d.client_name=c?c.name:'';try{await api('/orders',{method:'POST',body:JSON.stringify(d)});closeModal();toast('OS aberta.');go('orders')}catch(x){toast(x.message,true)}}}catch(e){toast(e.message,true)}}
async function advance(id){var o=S.orders.find(function(x){return x.id===id}),n=o.status==='pendente'?'em_andamento':o.status==='em_andamento'?'concluido':'pendente';await api('/orders/'+id,{method:'PUT',body:JSON.stringify(Object.assign({},o,{status:n}))});orders()}
async function budgets(){S.budgets=await api('/budgets');var bubbles=S.chat.map(function(x){return '<div class="bubble '+(x.role==='user'?'me':'')+'">'+esc(x.text)+'</div>'}).join('')||'<div class="bubble">Ex.: “PCX 2019 precisa de pastilha dianteira e óleo”.</div>';qs('#content').innerHTML=hero('ORÇAMENTOS','Manual ou assistido por IA usando os preços reais do estoque.','<button class="btn red" onclick="openBudget()">+ Criar orçamento</button>')+'<div class="ai"><b>MF IA · ORÇAMENTO ASSISTIDO</b><div class="chat">'+bubbles+'</div><div style="display:flex;gap:7px"><input id="aiInput" class="input" placeholder="Descreva o orçamento"><button class="btn red" onclick="askAI()">Enviar</button></div></div><div class="tableWrap"><table class="table"><thead><tr><th>Cliente/Placa</th><th>Itens</th><th>Total</th><th>Status</th><th>Data</th></tr></thead><tbody>'+(S.budgets.map(function(b){return '<tr><td><b>'+esc(b.client_name||'-')+'</b><br><small>'+esc(b.plate)+'</small></td><td>'+(b.items||[]).length+'</td><td class="gold money">'+brl(b.grand_total)+'</td><td>'+badge(b.status)+'</td><td>'+dt(b.created_at)+'</td></tr>'}).join('')||'<tr><td colspan="5" class="empty">Nenhum orçamento.</td></tr>')+'</tbody></table></div>'}
async function askAI(){var m=qs('#aiInput').value.trim();if(!m)return;S.chat.push({role:'user',text:m});budgets();try{var d=await api('/ai/budget',{method:'POST',body:JSON.stringify({message:m})}),lines=(d.items||[]).map(function(x){return x.quantity+'x '+x.name+': '+(x.needs_price?'preço pendente':brl(x.total))}).join('\n');S.chat.push({role:'assistant',text:(d.reply||'')+(lines?'\n'+lines+'\nTotal: '+brl(d.grand_total):'')});budgets()}catch(e){S.chat.push({role:'assistant',text:'⚠ '+e.message});budgets()}}
function openBudget(){modal('Novo orçamento','<form id="budgetForm"><div class="form"><div class="field"><label>Cliente</label><input class="input" name="client_name"></div><div class="field"><label>Placa</label><input class="input" name="plate"></div><div class="field span"><label>Itens, um por linha: nome | qtd | preço</label><textarea id="budgetLines"></textarea></div></div><button class="btn red full">Salvar orçamento</button></form>');qs('#budgetForm').onsubmit=async function(e){e.preventDefault();var d=Object.fromEntries(new FormData(e.target)),it=qs('#budgetLines').value.split('\n').map(function(l){var p=l.split('|').map(function(x){return x.trim()}),name=p[0],qty=+(p[1]||1),price=+(p[2]||0);return name?{name:name,quantity:qty,unit_price:price,total:qty*price}:null}).filter(Boolean);d.items=it;d.grand_total=it.reduce(function(a,x){return a+x.total},0);await api('/budgets',{method:'POST',body:JSON.stringify(d)});closeModal();toast('Orçamento salvo.');budgets()}}
async function pos(){S.inventory=await api('/inventory');S.clients=await api('/clients');var products=S.inventory.filter(function(x){return x.quantity>0}).map(function(x){return '<div class="product" data-name="'+esc(x.name.toLowerCase())+'" onclick="cartAdd(\''+x.id+'\')"><b>'+esc(x.name)+'</b><small>'+x.quantity+' em estoque</small><div class="price">'+brl(x.price)+'</div></div>'}).join('')||'<div class="empty">Sem produtos.</div>';var cart=S.cart.map(function(x){return '<div class="cartline"><span>'+esc(x.name)+'<br><small>'+brl(x.price)+'</small></span><input class="input" type="number" min="1" max="'+x.stock+'" value="'+x.q+'" onchange="cartQty(\''+x.id+'\',this.value)"><button class="btn danger" onclick="cartRm(\''+x.id+'\')">×</button></div>'}).join('')||'<div class="empty">Vazio</div>';qs('#content').innerHTML=hero('PDV','Venda rápida com baixa automática no estoque.','<button class="btn" onclick="S.cart=[];pos()">Limpar</button>')+'<div class="posgrid"><div><div class="toolbar"><input id="productSearch" class="input" placeholder="Buscar produto"></div><div class="products">'+products+'</div></div><div class="card"><b>CARRINHO</b>'+cart+'<div class="field"><label>Cliente</label><select id="saleClient"><option value="">Consumidor</option>'+S.clients.map(function(c){return '<option value="'+c.id+'">'+esc(c.name)+'</option>'}).join('')+'</select></div><div class="field"><label>Pagamento</label><select id="payment"><option value="pix">Pix</option><option value="dinheiro">Dinheiro</option><option value="debito">Débito</option><option value="credito">Crédito</option></select></div><div class="field"><label>Desconto</label><input id="discount" class="input" type="number" step=".01" value="0"></div><button class="btn red full" onclick="finishSale()">Finalizar · '+brl(S.cart.reduce(function(a,x){return a+x.price*x.q},0))+'</button></div></div>';qs('#productSearch').oninput=function(e){var x=e.target.value.toLowerCase();document.querySelectorAll('.product').forEach(function(p){p.style.display=p.dataset.name.includes(x)?'':'none'})}}
function cartAdd(id){var p=S.inventory.find(function(x){return x.id===id}),z=S.cart.find(function(x){return x.id===id});if(z)z.q=Math.min(z.q+1,p.quantity);else S.cart.push({id:p.id,name:p.name,price:+p.price,q:1,stock:p.quantity});pos()}function cartQty(id,v){var x=S.cart.find(function(z){return z.id===id});x.q=Math.max(1,Math.min(x.stock,+v||1));pos()}function cartRm(id){S.cart=S.cart.filter(function(x){return x.id!==id});pos()}
async function finishSale(){if(!S.cart.length)return toast('Carrinho vazio.',true);var cid=qs('#saleClient').value,c=S.clients.find(function(x){return x.id===cid});try{var sale=await api('/sales',{method:'POST',body:JSON.stringify({client_name:c?c.name:'',items:S.cart.map(function(x){return {inventory_id:x.id,quantity:x.q,unit_price:x.price}}),discount:+qs('#discount').value||0,payment_method:qs('#payment').value})});S.cart=[];toast('Venda finalizada: '+brl(sale.total));pos()}catch(e){toast(e.message,true)}}
async function fiscal(){S.fiscal=await api('/fiscal');S.sales=await api('/sales');qs('#content').innerHTML=hero('FISCAL','Rascunhos e emissão via provedor autorizado.','<button class="btn red" onclick="openFiscal()">+ Nova nota</button>')+'<div class="warn"><b>Emissão correta:</b> sem credenciais de provedor fiscal/SEFAZ, o documento permanece em rascunho. Só aparece como emitido após autorização real.</div><div class="tableWrap"><table class="table"><thead><tr><th>Tipo</th><th>Cliente</th><th>Total</th><th>Status</th><th>Chave/ref.</th><th></th></tr></thead><tbody>'+(S.fiscal.map(function(f){return '<tr><td><b>'+esc(f.type)+'</b></td><td>'+esc(f.client_name||'Consumidor')+'</td><td>'+brl(f.total)+'</td><td>'+badge(f.status)+'</td><td><small>'+esc(f.access_key||f.provider_ref||'-')+'</small></td><td>'+(f.status==='rascunho'?'<button class="btn" onclick="issueFiscal(\''+f.id+'\')">Emitir</button>':'')+'</td></tr>'}).join('')||'<tr><td colspan="6" class="empty">Nenhum documento.</td></tr>')+'</tbody></table></div>'}
function openFiscal(){modal('Novo documento fiscal','<form id="fiscalForm" class="form"><div class="field"><label>Venda</label><select name="sale_id" id="fiscalSale"><option value="">Avulsa</option>'+S.sales.map(function(s){return '<option value="'+s.id+'">'+dt(s.created_at)+' · '+brl(s.total)+'</option>'}).join('')+'</select></div><div class="field"><label>Tipo</label><select name="type"><option>NFC-e</option><option>NF-e</option><option>NFS-e</option></select></div><div class="field"><label>Cliente</label><input id="fiscalClient" class="input" name="client_name"></div><div class="field"><label>CPF/CNPJ</label><input class="input" name="client_document"></div><div class="field span"><label>Total</label><input id="fiscalTotal" class="input" type="number" step=".01" name="total" required></div><textarea id="fiscalItems" class="hide" name="items">[]</textarea><button class="btn red span">Salvar rascunho</button></form>');qs('#fiscalSale').onchange=function(e){var s=S.sales.find(function(x){return x.id===e.target.value});if(s){qs('#fiscalClient').value=s.client_name||'';qs('#fiscalTotal').value=s.total;qs('#fiscalItems').value=JSON.stringify(s.items||[])}};qs('#fiscalForm').onsubmit=async function(e){e.preventDefault();var d=Object.fromEntries(new FormData(e.target));d.items=JSON.parse(d.items||'[]');try{await api('/fiscal',{method:'POST',body:JSON.stringify(d)});closeModal();toast('Rascunho fiscal criado.');fiscal()}catch(x){toast(x.message,true)}}}
async function issueFiscal(id){try{await api('/fiscal/'+id+'/issue',{method:'POST'});toast('Documento autorizado.');fiscal()}catch(e){toast(e.message,true)}}
if(S.token)boot();else showApp(false);
</script>
